<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0e1a;
            --bg-card: #111827;
            --bg-card-hover: #1a2235;
            --accent: #60a5fa;
            --accent-glow: rgba(96, 165, 250, 0.15);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: rgba(96, 165, 250, 0.12);
            --success: #34d399;
            --danger: #f87171;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated background */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(96, 165, 250, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(139, 92, 246, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(52, 211, 153, 0.04) 0%, transparent 50%);
            animation: bgShift 20s ease-in-out infinite alternate;
            z-index: 0;
        }

        @keyframes bgShift {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(-5%, -5%) rotate(3deg); }
        }

        /* Floating particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--accent);
            border-radius: 50%;
            opacity: 0;
            animation: float linear infinite;
        }

        @keyframes float {
            0% { opacity: 0; transform: translateY(100vh) scale(0); }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { opacity: 0; transform: translateY(-10vh) scale(1); }
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        /* Login Card */
        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 48px 36px;
            position: relative;
            overflow: hidden;
            animation: cardEntry 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes cardEntry {
            to { opacity: 1; transform: translateY(0); }
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            opacity: 0.5;
        }

        /* Logo / Icon */
        .logo-container {
            text-align: center;
            margin-bottom: 32px;
            animation: fadeIn 0.6s 0.3s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(96, 165, 250, 0.2);
        }

        .logo-icon svg {
            width: 32px;
            height: 32px;
            fill: white;
        }

        .login-title {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .login-subtitle {
            color: var(--text-secondary);
            font-size: 15px;
            font-weight: 300;
        }

        /* Google Button */
        .google-btn {
            width: 100%;
            padding: 16px 24px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: var(--bg-card-hover);
            color: var(--text-primary);
            font-family: 'Tajawal', sans-serif;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            animation: fadeIn 0.6s 0.5s both;
            position: relative;
            overflow: hidden;
        }

        .google-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(96, 165, 250, 0.1), rgba(139, 92, 246, 0.1));
            opacity: 0;
            transition: opacity 0.3s;
        }

        .google-btn:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(96, 165, 250, 0.15);
        }

        .google-btn:hover::before {
            opacity: 1;
        }

        .google-btn:active {
            transform: translateY(0);
        }

        .google-btn img {
            width: 22px;
            height: 22px;
        }

        .google-btn.loading {
            pointer-events: none;
            opacity: 0.7;
        }

        .google-btn.loading .btn-text {
            visibility: hidden;
        }

        .google-btn.loading::after {
            content: '';
            position: absolute;
            width: 22px;
            height: 22px;
            border: 2px solid transparent;
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 28px 0;
            animation: fadeIn 0.6s 0.6s both;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .divider span {
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 300;
        }

        /* Terms */
        .terms {
            text-align: center;
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 300;
            line-height: 1.8;
            animation: fadeIn 0.6s 0.7s both;
        }

        .terms a {
            color: var(--accent);
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .terms a:hover {
            opacity: 0.8;
        }

        /* ===== Profile Card (After Login) ===== */
        .profile-card {
            display: none;
            text-align: center;
            animation: cardEntry 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .profile-card.active {
            display: block;
        }

        .login-content.hidden {
            display: none;
        }

        .profile-avatar {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            border: 3px solid var(--accent);
            padding: 3px;
            margin: 0 auto 20px;
            position: relative;
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .profile-avatar::after {
            content: '✓';
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 24px;
            height: 24px;
            background: var(--success);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: white;
            border: 2px solid var(--bg-card);
        }

        .profile-name {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .profile-email {
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 300;
            margin-bottom: 8px;
        }

        .profile-badge {
            display: inline-block;
            padding: 4px 14px;
            background: rgba(52, 211, 153, 0.1);
            border: 1px solid rgba(52, 211, 153, 0.2);
            border-radius: 20px;
            color: var(--success);
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 28px;
        }

        .profile-info {
            background: rgba(96, 165, 250, 0.05);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 24px;
            text-align: start;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
        }

        .info-row:not(:last-child) {
            border-bottom: 1px solid var(--border);
        }

        .info-label {
            color: var(--text-secondary);
            font-size: 13px;
        }

        .info-value {
            font-size: 13px;
            font-weight: 500;
        }

        /* Logout Button */
        .logout-btn {
            width: 100%;
            padding: 14px;
            border: 1px solid rgba(248, 113, 113, 0.2);
            border-radius: 14px;
            background: rgba(248, 113, 113, 0.05);
            color: var(--danger);
            font-family: 'Tajawal', sans-serif;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: rgba(248, 113, 113, 0.1);
            border-color: rgba(248, 113, 113, 0.4);
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            padding: 14px 28px;
            border-radius: 12px;
            font-family: 'Tajawal', sans-serif;
            font-size: 14px;
            font-weight: 500;
            z-index: 100;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(12px);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .toast.success {
            background: rgba(52, 211, 153, 0.15);
            border: 1px solid rgba(52, 211, 153, 0.3);
            color: var(--success);
        }

        .toast.error {
            background: rgba(248, 113, 113, 0.15);
            border: 1px solid rgba(248, 113, 113, 0.3);
            color: var(--danger);
        }

        /* Setup Banner */
        .setup-banner {
            background: rgba(251, 191, 36, 0.08);
            border: 1px solid rgba(251, 191, 36, 0.2);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 24px;
            animation: fadeIn 0.6s 0.4s both;
        }

        .setup-banner h3 {
            color: #fbbf24;
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .setup-banner p {
            color: var(--text-secondary);
            font-size: 13px;
            line-height: 1.8;
            margin-bottom: 4px;
        }

        .setup-banner code {
            background: rgba(251, 191, 36, 0.1);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 12px;
            color: #fbbf24;
            direction: ltr;
            display: inline-block;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 36px 24px;
            }
        }
    </style>
</head>
<body>

    <!-- Floating Particles -->
    <div class="particles" id="particles"></div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <div class="container">
        <div class="login-card">
            <!-- Login Content -->
            <div class="login-content" id="loginContent">
                <div class="logo-container">
                    <div class="logo-icon">
                        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
                    </div>
                    <h1 class="login-title">أهلاً بك</h1>
                    <p class="login-subtitle">سجّل دخولك للمتابعة</p>
                </div>

                <button class="google-btn" id="googleBtn" onclick="signInWithGoogle()">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                    <span class="btn-text">تسجيل الدخول بحساب Google</span>
                </button>

                <div class="divider">
                    <span>آمن ومشفر</span>
                </div>

                <p class="terms">
                    بتسجيلك، أنت توافق على
                    <a href="#">شروط الاستخدام</a>
                    و
                    <a href="#">سياسة الخصوصية</a>
                </p>
            </div>

            <!-- Profile Content (shown after login) -->
            <div class="profile-card" id="profileCard">
                <div class="profile-avatar">
                    <img id="userPhoto" src="" alt="صورة المستخدم">
                </div>
                <h2 class="profile-name" id="userName"></h2>
                <p class="profile-email" id="userEmail"></p>
                <div class="profile-badge">✓ تم تسجيل الدخول</div>

                <div class="profile-info">
                    <div class="info-row">
                        <span class="info-label">المعرّف</span>
                        <span class="info-value" id="userId">—</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">مزوّد الدخول</span>
                        <span class="info-value">Google</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">تاريخ الدخول</span>
                        <span class="info-value" id="loginTime">—</span>
                    </div>
                </div>

                <button class="logout-btn" onclick="signOutUser()">تسجيل الخروج</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

    <script>
        // ╔══════════════════════════════════════════╗
        // ║  🔥 حط بيانات مشروعك من Firebase هنا     ║
        // ╚══════════════════════════════════════════╝
        const firebaseConfig = {
            apiKey: "AIzaSyCArHNsJL2LNRFFD-vwg2MOqu96uw4pEuw",
            authDomain: "login-d18eb.firebaseapp.com",
            projectId: "login-d18eb",
            storageBucket: "login-d18eb.firebasestorage.app",
            messagingSenderId: "935859959192",
            appId: "1:935859959192:web:6f360312b153d3be6fa7ed",
            measurementId: "G-HG5PEHQ5L2"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const provider = new firebase.auth.GoogleAuthProvider();

        // ===== DOM Elements =====
        const loginContent = document.getElementById('loginContent');
        const profileCard = document.getElementById('profileCard');
        const googleBtn = document.getElementById('googleBtn');
        const toast = document.getElementById('toast');

        // ===== Sign In with Google =====
        async function signInWithGoogle() {
            try {
                googleBtn.classList.add('loading');
                const result = await auth.signInWithPopup(provider);
                const user = result.user;

                showProfile(user);
                showToast(`أهلاً ${user.displayName} 👋`, 'success');
            } catch (error) {
                console.error('Login error:', error);
                if (error.code === 'auth/popup-closed-by-user') {
                    showToast('تم إلغاء تسجيل الدخول', 'error');
                } else if (error.code === 'auth/api-key-not-valid.-please-pass-a-valid-api-key.') {
                    showToast('⚠️ حط بيانات Firebase الصحيحة أول', 'error');
                } else {
                    showToast('حصل خطأ، حاول مرة ثانية', 'error');
                }
            } finally {
                googleBtn.classList.remove('loading');
            }
        }

        // ===== Sign Out =====
        async function signOutUser() {
            try {
                await auth.signOut();
                loginContent.classList.remove('hidden');
                profileCard.classList.remove('active');
                showToast('تم تسجيل الخروج ✌️', 'success');
            } catch (error) {
                showToast('حصل خطأ بتسجيل الخروج', 'error');
            }
        }

        // ===== Show Profile =====
        function showProfile(user) {
            document.getElementById('userPhoto').src = user.photoURL || '';
            document.getElementById('userName').textContent = user.displayName || 'مستخدم';
            document.getElementById('userEmail').textContent = user.email;
            document.getElementById('userId').textContent = user.uid.substring(0, 12) + '...';
            document.getElementById('loginTime').textContent = new Date().toLocaleString('ar-SA');

            loginContent.classList.add('hidden');
            profileCard.classList.add('active');
        }

        // ===== Auth State Listener =====
        auth.onAuthStateChanged((user) => {
            if (user) {
                showProfile(user);
            }
        });

        // ===== Toast =====
        function showToast(message, type = 'success') {
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            setTimeout(() => toast.classList.remove('show'), 3500);
        }

        // ===== Particles =====
        (function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const p = document.createElement('div');
                p.classList.add('particle');
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = (8 + Math.random() * 12) + 's';
                p.style.animationDelay = Math.random() * 10 + 's';
                p.style.width = p.style.height = (1 + Math.random() * 2) + 'px';
                container.appendChild(p);
            }
        })();
    </script>
</body>
</html>
